<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Australia Cares Foundation · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2A47; --ink-2:#163B61; --on-ink:#FFFFFF;
  --teal:#13777A; --teal-soft:#E2F0EF;
  --wattle:#E9A93B; --wattle-soft:#FBF1DC; --gold-ink:#3D2A06;
  --gum:#13777A; --gum-soft:#E2F0EF;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF1F5; --line:#DCE2EA; --line-2:#C8D1DC; --text:#13233A; --muted:#566578;
  --danger:#B42318; --danger-soft:#FDECEA; --warn:#8A5A00; --warn-soft:#FDF3DD; --info:#1D5FA8; --info-soft:#E6EFF9;
  --t1:#E7EEF6;
  --shadow:0 1px 2px rgba(19,35,58,.06),0 4px 14px -6px rgba(19,35,58,.12);
  --shadow-lg:0 2px 4px rgba(19,35,58,.06),0 18px 40px -18px rgba(19,35,58,.28);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --display:var(--serif);
  --r:10px;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#8FC2EE; --ink-2:#A7D0F3; --on-ink:#0A1626; --teal:#4FB8B6; --teal-soft:#123433; --wattle:#F0BA55; --wattle-soft:#3A2D13; --gold-ink:#22180A;
    --gum:#4FB8B6; --gum-soft:#123433; --bg:#0B1522; --surface:#122033; --surface-2:#1A2A40; --line:#263851; --line-2:#334862; --text:#E7EDF4; --muted:#9FB0C3;
    --danger:#F5867B; --danger-soft:#3B1915; --warn:#F2C46B; --warn-soft:#382B12; --info:#8CB8EC; --info-soft:#162A44; --t1:#1A2D47;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px -6px rgba(0,0,0,.5); --shadow-lg:0 18px 40px -18px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#8FC2EE; --ink-2:#A7D0F3; --on-ink:#0A1626; --teal:#4FB8B6; --teal-soft:#123433; --wattle:#F0BA55; --wattle-soft:#3A2D13; --gold-ink:#22180A;
  --gum:#4FB8B6; --gum-soft:#123433; --bg:#0B1522; --surface:#122033; --surface-2:#1A2A40; --line:#263851; --line-2:#334862; --text:#E7EDF4; --muted:#9FB0C3;
  --danger:#F5867B; --danger-soft:#3B1915; --warn:#F2C46B; --warn-soft:#382B12; --info:#8CB8EC; --info-soft:#162A44; --t1:#1A2D47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px -6px rgba(0,0,0,.5); --shadow-lg:0 18px 40px -18px rgba(0,0,0,.7); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
img,svg{max-width:100%}
a{color:inherit}
h1,h2{font-family:var(--serif);font-weight:700;line-height:1.14;letter-spacing:-.01em;margin:0 0 .45em}
h3,h4{font-family:var(--body);font-weight:700;line-height:1.25;margin:0 0 .4em}
h1{font-size:clamp(2rem,3.6vw,2.9rem)}
h2{font-size:clamp(1.5rem,2.3vw,2rem)}
h3{font-size:1.15rem} h4{font-size:1.02rem}
p{margin:0 0 .9em;max-width:68ch}
.muted{color:var(--muted)} .small{font-size:.92rem} .tiny{font-size:.82rem}
:focus-visible{outline:3px solid var(--wattle);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* demo bar, separate from product */
#demobar{position:relative;z-index:50;background:#0A1626;color:#fff;font-size:.84rem;display:flex;align-items:center;gap:.55rem;padding:.38rem 1rem;flex-wrap:wrap}
#demobar .tag{background:#E9A93B;color:#1C1405;font-weight:700;border-radius:4px;padding:.05rem .45rem;font-size:.76rem}
#demobar select,#demobar button{width:auto;margin:0;font:inherit;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:.22rem .6rem;cursor:pointer}
#demobar select option{color:#13233A}
#demobar button:hover{background:rgba(255,255,255,.16)}
#demobar .grow{flex:1}
@media (max-width:640px){#demobar .hide-sm{display:none}}

/* buttons, forms */
.btn{white-space:nowrap;font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:8px;padding:.68rem 1.2rem;min-height:44px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,box-shadow .15s,color .15s}
.btn-donate{background:var(--wattle);color:var(--gold-ink)}
.btn-donate:hover{background:#DD9A26;box-shadow:0 6px 16px -8px rgba(201,135,20,.7)}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-primary:hover{background:var(--ink-2)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--text)}
.btn-ghost:hover{border-color:var(--ink);background:var(--surface-2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-link{background:none;border:none;padding:0;color:var(--teal);font-weight:700;cursor:pointer;font:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.btn-link:hover{color:var(--ink)}
.btn-sm{padding:.42rem .8rem;font-size:.9rem;min-height:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
@media (max-width:420px){.btn{white-space:normal;text-align:center}}
label.f{display:block;font-weight:600;font-size:.95rem;margin:0 0 1rem}
label.f span.hint{display:block;font-weight:400;color:var(--muted);font-size:.86rem}
input,select,textarea{font:inherit;font-weight:400;color:var(--text);background:var(--surface);border:1.5px solid var(--line-2);border-radius:8px;padding:.62rem .8rem;width:100%;margin-top:.35rem;min-height:44px;transition:border-color .15s, box-shadow .15s}
textarea{min-height:104px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--t1)}
input[type=range]{padding:0;border:none;background:transparent;box-shadow:none!important;min-height:0;accent-color:var(--wattle)}
input[type=checkbox],input[type=radio]{-webkit-appearance:none;appearance:none;width:20px;height:20px;min-height:0;flex:none;margin:.18rem .65rem 0 0;padding:0;border:2px solid var(--line-2);border-radius:5px;background:var(--surface);display:inline-grid;place-content:center;cursor:pointer;vertical-align:middle;box-shadow:none;transition:background .12s,border-color .12s}
input[type=radio]{border-radius:50%}
input[type=checkbox]::before{content:"";width:11px;height:11px;background:#fff;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);transform:scale(0);transition:transform .12s}
input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
:root[data-theme="dark"] input[type=checkbox]::before{background:#0A1626}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input[type=checkbox]::before{background:#0A1626}}
input[type=checkbox]:checked::before{transform:scale(1)}
input[type=radio]::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .12s}
input[type=radio]:checked{border-color:var(--ink)} input[type=radio]:checked::before{transform:scale(1)}
input[type=checkbox]:disabled,input[type=radio]:disabled{opacity:.35;cursor:not-allowed}
.check{display:flex;align-items:flex-start;gap:0;font-weight:600;margin:.55rem 0;line-height:1.5;cursor:pointer}
.check span span,.check .muted{font-weight:400}
.row .check,.toolbar .check{margin:0;align-items:center} .row .check input,.toolbar .check input{margin-top:0}
.field-error{color:var(--danger);font-size:.88rem;font-weight:600;margin-top:.3rem;display:flex;gap:.3rem;align-items:center}
.field-error::before{content:"!";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-size:.7rem;font-weight:700;flex:none}
.invalid{border-color:var(--danger)!important;box-shadow:0 0 0 3px var(--danger-soft)!important}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
.grid2 > label.f,.grid3 > label.f{align-self:end}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

/* public chrome */
.wrap{max-width:1180px;margin:0 auto;padding:0 1.25rem}
header.pub{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
header.pub .wrap{display:flex;align-items:center;gap:1.4rem;height:72px}
header.pub .btn,.logo span{white-space:nowrap}
.logo{display:flex;align-items:center;gap:.65rem;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:1.12rem;line-height:1.1;color:var(--ink)}
:root[data-theme="dark"] .logo{color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{color:var(--text)}}
.logo small{display:block;font-family:var(--body);font-weight:600;font-size:.74rem;color:var(--muted)}
.logo svg{flex:none}
nav.main{display:flex;gap:.2rem;flex:1;margin-left:.6rem}
nav.main a{text-decoration:none;font-weight:600;color:var(--muted);padding:.55rem .75rem;border-radius:6px;position:relative}
nav.main a:hover{color:var(--ink);background:var(--surface-2)}
nav.main a.on{color:var(--ink)}
nav.main a.on::after{content:"";position:absolute;left:.75rem;right:.75rem;bottom:-14px;height:3px;background:var(--wattle);border-radius:2px}
.menu-btn{display:none}
@media (max-width:980px){nav.main{display:none} .menu-btn{display:inline-flex;margin-left:auto} header.pub .hide-md{display:none}}
@media (max-width:560px){.logo .lg-f{display:none} header.pub .wrap{gap:.6rem}}
.mobile-nav{display:none;background:var(--surface);border-bottom:1px solid var(--line);padding:.6rem 1.25rem 1rem}
.mobile-nav.open{display:block}
.mobile-nav a{display:block;padding:.75rem 0;font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
footer.pub{background:#0E2A47;color:#DCE6F1;margin-top:4.5rem;padding:3.4rem 0 2rem}
footer.pub a{color:#C3D2E2;text-decoration:none;display:block;padding:.22rem 0}
footer.pub a:hover{color:#fff;text-decoration:underline}
footer.pub a.logo{display:inline-flex;align-items:center;gap:.65rem;padding:0;color:#fff;text-decoration:none}
footer.pub b{display:block;margin-bottom:.5rem;color:#fff;font-weight:700}
footer.pub .muted{color:#A9BCD0}
footer.pub .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:2rem}
footer.pub .legal{border-top:1px solid rgba(255,255,255,.12);margin-top:2.4rem;padding-top:1.2rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
@media (max-width:800px){footer.pub .cols{grid-template-columns:1fr 1fr}}

/* hero */
.hero{position:relative;overflow:hidden;background:#0E2A47;color:#fff;padding:4rem 0 4.4rem}
.hero .bgart{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:3rem;align-items:center}
@media (max-width:920px){.hero .wrap{grid-template-columns:1fr}.hero{padding:2.8rem 0 3rem}}
.hero h1{color:#fff;font-size:clamp(2.2rem,4.3vw,3.4rem);max-width:17ch}
.hero .lede{font-size:1.2rem;color:#D3DEEA;max-width:46ch}
.hero .eyebrow{display:inline-flex;align-items:center;gap:.5rem;color:#F3CF8B;font-weight:600;font-size:.95rem;margin-bottom:.9rem}
.hero .eyebrow svg{width:18px;height:18px}
.searchbar{display:flex;gap:.5rem;background:#fff;border-radius:10px;padding:.35rem .35rem .35rem 1rem;max-width:560px;margin:1.6rem 0 1.2rem;align-items:center;box-shadow:0 10px 30px -12px rgba(0,0,0,.4)}
.searchbar svg{width:20px;height:20px;color:#566578;flex:none}
.searchbar input{border:none;margin:0;padding:.4rem 0;box-shadow:none!important;background:transparent;color:#13233A;min-height:40px}
.hero .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.hero .btn-ghost:hover{background:rgba(255,255,255,.08);border-color:#fff}
.trustline{display:flex;gap:1.4rem;flex-wrap:wrap;margin-top:1.6rem;color:#C3D2E2;font-size:.94rem}
.trustline span{display:inline-flex;align-items:center;gap:.4rem}
.trustline svg{width:18px;height:18px;color:#F3CF8B}
.split-card{background:#fff;color:#13233A;border-radius:14px;padding:1.4rem 1.5rem;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
:root[data-theme="dark"] .split-card{background:var(--surface);color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .split-card{background:var(--surface);color:var(--text)}}
.split-card h3{font-size:1rem;color:var(--muted);font-weight:600;margin:0 0 .3rem}
.split-amount{font-family:var(--serif);font-size:2.6rem;font-weight:700;line-height:1;color:var(--ink)}
.split-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:1rem 0 .7rem;background:var(--surface-2);gap:2px}
.split-bar .a{background:var(--teal)} .split-bar .b{background:var(--wattle)}
.split-legend{display:flex;justify-content:space-between;gap:1rem;font-size:.9rem;color:var(--muted)}
.split-legend b{font-family:var(--serif);font-size:1.2rem;display:block;color:var(--text)}
.split-card input[type=range]{margin-top:.8rem}
.split-card p{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem;vertical-align:middle}

/* paths, sections */
.section{padding-top:3.2rem;padding-bottom:3.2rem}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap}
.section-head p{margin:0}
.band{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:-2.2rem;position:relative;z-index:2}
@media (max-width:760px){.paths{grid-template-columns:1fr;margin-top:1.2rem}}
.path{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.4rem 1.5rem;display:grid;grid-template-columns:48px 1fr auto;gap:1rem;align-items:center;text-decoration:none;box-shadow:var(--shadow);transition:border-color .15s, box-shadow .15s}
.path:hover{border-color:var(--ink);box-shadow:var(--shadow-lg)}
.path .ic{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:var(--t1);color:var(--ink)}
.path .ic svg{width:24px;height:24px}
.path h3{margin:0 0 .15rem} .path p{margin:0;color:var(--muted);font-size:.95rem}
.path .go{color:var(--ink);font-weight:700;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem;counter-reset:s}
.steps > div{border-top:2px solid var(--line);padding-top:1rem;position:relative}
.steps > div::before{counter-increment:s;content:counter(s);position:absolute;top:-15px;left:0;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.steps h4{margin-top:.6rem}
@media (max-width:800px){.steps{grid-template-columns:1fr 1fr;row-gap:2.2rem}}
.cause-strip{display:flex;gap:.6rem;flex-wrap:wrap}
.cause-tile{display:inline-flex;align-items:center;gap:.55rem;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:.55rem .95rem;text-decoration:none;font-weight:600;transition:border-color .15s,background .15s}
.cause-tile:hover{border-color:var(--ink);background:var(--surface-2)}
.cause-tile svg{width:20px;height:20px;color:var(--teal)}
.quote{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--wattle);border-radius:10px;padding:1.4rem 1.5rem}
.quote p{font-family:var(--serif);font-size:1.2rem;line-height:1.45;color:var(--text);margin-bottom:.9rem}
.person{display:flex;align-items:center;gap:.7rem}
.person small{display:block;color:var(--muted);font-size:.86rem}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow-lg)}
.card:hover h4{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.card .cover{height:160px;position:relative}
.card .cover .verified{position:absolute;left:10px;top:10px}
.card .body{padding:1rem 1.1rem 1.15rem;display:flex;flex-direction:column;gap:.25rem;flex:1}
.card .kind{font-size:.85rem;color:var(--muted);font-weight:600}
.card h4{margin:.1rem 0 .1rem;font-size:1.08rem;line-height:1.3}
.card .meta{display:flex;justify-content:space-between;gap:.5rem;font-size:.88rem;color:var(--muted);margin-top:auto;padding-top:.5rem}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:.55rem 0 .3rem}
.progress > i{display:block;height:100%;background:var(--teal);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.raised{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-size:.92rem}
.raised b{font-size:1.02rem}
.cover-art{position:absolute;inset:0;display:block;width:100%;height:100%}
.verified{display:inline-flex;align-items:center;gap:.3rem;background:rgba(255,255,255,.94);color:#0E2A47;font-size:.78rem;font-weight:700;border-radius:4px;padding:.18rem .45rem}
.verified svg{width:14px;height:14px;color:#13777A}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.4rem}
.panel + .panel{margin-top:1rem}
.grid2 > .panel,.grid3 > .panel,.two-col > .panel,.cards > .panel{margin-top:0}
.panel h3{margin-bottom:.75rem}
a.panel{text-decoration:none;transition:border-color .15s, box-shadow .15s}
a.panel:hover{border-color:var(--line-2);box-shadow:var(--shadow)}

/* badges */
.badge{flex:none;display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:600;border-radius:4px;padding:.12rem .5rem;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.nodot::before{display:none}
.b-ok{background:var(--gum-soft);color:#0F5F61} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--danger-soft);color:var(--danger)} .b-info{background:var(--info-soft);color:var(--info)} .b-y{background:var(--wattle-soft);color:var(--warn)}
:root[data-theme="dark"] .b-ok{color:var(--gum)} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b-ok{color:var(--gum)}}
.testmode{display:inline-flex;gap:.35rem;align-items:center;font-size:.8rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:.12rem .5rem}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl-wrap table{min-width:640px}
th,td{text-align:left;padding:.75rem .95rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.84rem;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--bg)}
td .row{flex-wrap:nowrap}
.nw{white-space:nowrap}
.empty{padding:2.4rem 1rem;text-align:center;color:var(--muted)}
.empty::before{content:"";display:block;width:44px;height:44px;margin:0 auto .8rem;border-radius:50%;border:2px solid var(--line-2);background:radial-gradient(circle,var(--line-2) 0 4px,transparent 5px)}
.empty b{display:block;color:var(--text);font-size:1.08rem;margin-bottom:.25rem}

/* portal */
.portal{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);color:var(--text);padding:1.2rem .85rem;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto}
.side .logo{margin:0 .4rem 1.2rem}
.side .logo span{white-space:normal;font-size:1rem}
.side a.nav{display:flex;align-items:center;gap:.65rem;padding:.55rem .7rem;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem;margin-bottom:1px;position:relative}
.side a.nav svg{flex:none;width:18px;height:18px}
.side a.nav span:first-of-type{flex:1}
.side a.nav:hover{color:var(--text);background:var(--surface-2)}
.side a.nav.on{color:var(--ink);background:var(--t1)}
.side a.nav.on::before{content:"";position:absolute;left:-.85rem;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--wattle)}
.side .grp{font-size:.78rem;font-weight:600;color:var(--muted);margin:1.1rem .7rem .35rem}
.side select{font-size:.92rem;font-weight:600}
.side .count{background:var(--wattle);color:var(--gold-ink);border-radius:4px;font-size:.74rem;font-weight:700;padding:0 .4rem;min-width:1.3rem;text-align:center;flex:none}
.side .who{display:flex;gap:.6rem;align-items:center;margin:0 .45rem 1rem;padding:.6rem;border-radius:8px;border:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff;background:#13777A;flex:none}
.portal > div{min-width:0}
.pmain{padding:2rem 2.2rem 4rem;min-width:0;max-width:1320px}
.ptitle{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.ptitle h1{font-size:clamp(1.6rem,2.4vw,2.05rem);margin-bottom:.2rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.9rem;margin-bottom:1.4rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem}
.kpi .v{font-family:var(--serif);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{color:var(--muted);font-size:.88rem;font-weight:500}
.kpi.hl{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.kpi.hl .l{color:var(--on-ink);opacity:.8}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.toolbar input,.toolbar select{width:auto;margin:0;padding:.45rem .7rem;font-size:.95rem;min-height:40px}
.toolbar input[type=checkbox]{width:20px;min-height:0;padding:0;margin:0 .55rem 0 0}
.tabs{display:flex;gap:.2rem;margin-bottom:1.3rem;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button,.tabs a{font:inherit;font-weight:600;background:none;border:none;padding:.65rem .95rem;color:var(--muted);cursor:pointer;white-space:nowrap;text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover,.tabs a:hover{color:var(--text)}
.tabs button.on,.tabs a.on{color:var(--ink);border-bottom-color:var(--wattle)}
.mob-portal-nav{display:none}
@media (max-width:900px){
  .portal{grid-template-columns:minmax(0,1fr)} .side{display:none}
  .mob-portal-nav{display:flex;gap:.4rem;overflow-x:auto;padding:.65rem 1rem;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
  .mob-portal-nav a{color:var(--muted);text-decoration:none;white-space:nowrap;font-size:.9rem;font-weight:600;padding:.4rem .75rem;border-radius:6px;border:1px solid var(--line)}
  .mob-portal-nav a.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  .pmain{padding:1.3rem 1rem 4rem}
}
.list-check{list-style:none;padding:0;margin:0}
.list-check li{display:flex;gap:.8rem;align-items:center;justify-content:space-between;padding:.8rem 0;border-bottom:1px solid var(--line)}
.list-check li:last-child{border:none}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:grid;grid-template-columns:32px minmax(0,1fr) 170px 80px;gap:.9rem;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--line)}
.checklist li:last-child{border-bottom:none}
.checklist .st,.checklist .act{display:flex;justify-content:flex-end}
.ck{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);color:var(--muted)}
.ck.done{background:var(--teal);border-color:var(--teal);color:#fff}
.ck svg{width:15px;height:15px}
.check-progress{display:flex;align-items:center;gap:.9rem;margin-bottom:.4rem}
.check-progress .progress{flex:1;margin:0}
@media (max-width:640px){.checklist li{grid-template-columns:32px minmax(0,1fr) auto}.checklist .st{grid-column:2;grid-row:2;justify-content:flex-start}.checklist .act{grid-column:3;grid-row:1/3}}
.timeline{list-style:none;padding:0;margin:0 0 0 5px;border-left:2px solid var(--line)}
.timeline li{padding:.05rem 0 .95rem 1.1rem;position:relative;font-size:.94rem}
.timeline li::before{content:"";position:absolute;left:-7px;top:.45rem;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--teal)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,22,38,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--surface);color:var(--text);border-radius:14px;max-width:640px;width:100%;max-height:calc(100vh - 2rem);overflow:auto;padding:1.6rem;box-shadow:var(--shadow-lg);animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.modal.wide{max-width:920px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.9rem}
.x{background:none;border:1px solid var(--line);font-size:1.25rem;line-height:1;cursor:pointer;color:var(--muted);width:36px;height:36px;border-radius:8px;flex:none}
.x:hover{background:var(--surface-2);color:var(--text)}
#toasts{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:.5rem;align-items:center}
.toast{max-width:min(460px,90vw);text-align:center;background:#0E2A47;color:#fff;padding:.75rem 1.15rem;border-radius:8px;font-weight:600;box-shadow:var(--shadow-lg);animation:tin .2s ease}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:85;box-shadow:-20px 0 60px rgba(10,22,38,.3);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .18s ease}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
.drawer .dh{padding:1.1rem 1.3rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem}
.drawer .db{padding:1.1rem 1.3rem;overflow:auto;flex:1;background:var(--bg)}
.wt-step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:.7rem}
.wt-step.done{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.wt-step ol{margin:.45rem 0 .5rem;padding-left:1.2rem;font-size:.93rem}
.wt-who{display:block;font-size:.84rem;color:var(--muted);font-weight:600;margin-top:.15rem}
.callout{border-radius:8px;background:var(--wattle-soft);padding:.85rem 1.05rem;margin:1rem 0;font-size:.97rem;border:1px solid rgba(233,169,59,.45)}
.callout.info{background:var(--info-soft);border-color:rgba(29,95,168,.25)}
.callout.bad{background:var(--danger-soft);border-color:rgba(180,35,24,.3)}

/* donate flow */
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.amounts button{font:inherit;font-weight:700;font-size:1.15rem;padding:.85rem 0 .9rem;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;position:relative;min-height:56px;transition:border-color .12s, background .12s}
.amounts button:hover{border-color:var(--ink)}
.amounts button.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.amounts .pop{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--wattle);color:var(--gold-ink);font-size:.7rem;font-weight:700;padding:.05rem .4rem;border-radius:4px;white-space:nowrap}
.impact{display:flex;gap:.7rem;align-items:flex-start;background:var(--teal-soft);border-radius:8px;padding:.75rem .9rem;margin-top:.8rem;font-size:.97rem}
.impact svg{width:20px;height:20px;flex:none;color:var(--teal);margin-top:.1rem}
.seg{display:inline-flex;border:1.5px solid var(--line-2);border-radius:8px;padding:3px;background:var(--surface)}
.seg button{font:inherit;font-weight:600;border:none;background:none;padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;color:var(--muted);min-height:40px}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.stepper{display:flex;gap:0;margin-bottom:1.4rem;counter-reset:st;flex-wrap:wrap}
.stepper span{font-size:.88rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:.45rem;padding-right:1.4rem;position:relative}
.stepper span::before{counter-increment:st;content:counter(st);width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:.8rem}
.stepper span.on{color:var(--ink)} .stepper span.on::before{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.stepper span.done{color:var(--teal)} .stepper span.done::before{content:"✓";background:var(--teal);border-color:var(--teal);color:#fff}
.summary-line{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.summary-line > :last-child{text-align:right}
.summary-line.total{font-weight:700;border-bottom:none;font-size:1.1rem}
.pay-methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.55rem}
.pay-methods label{border:1.5px solid var(--line-2);border-radius:8px;padding:.75rem;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:.95rem;background:var(--surface);min-height:48px}
.pay-methods label:has(input:checked){border-color:var(--ink);background:var(--t1)}
.sim-gateway{border:1.5px dashed var(--warn);border-radius:10px;padding:1.1rem;background:var(--warn-soft)}
.secure{display:flex;gap:1.1rem;flex-wrap:wrap;color:var(--muted);font-size:.86rem;margin-top:1rem}
.secure span{display:inline-flex;gap:.35rem;align-items:center}
.secure svg{width:16px;height:16px;color:var(--teal)}

/* profile pages */
.crumbs{font-size:.9rem;color:var(--muted);margin:1.2rem 0 .8rem;display:flex;gap:.4rem;flex-wrap:wrap}
.crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--ink)}
.profile-hero{position:relative;overflow:hidden;height:260px;border-radius:12px;width:calc(100% - 2.5rem);max-width:1140px;margin:0 auto}
.org-mark{width:84px;height:84px;border-radius:12px;border:4px solid var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:1.7rem;color:#fff;margin-top:-42px;position:relative;box-shadow:var(--shadow)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:2.4rem;align-items:start}
.mobile-only{display:none!important}
@media (max-width:920px){.two-col{grid-template-columns:minmax(0,1fr)} .two-col > .sticky-side{position:static} .mobile-only{display:inline-flex!important} .profile-hero{height:210px}}
.sticky-side{position:sticky;top:92px}
.sticky-side > .panel{box-shadow:var(--shadow-lg)}
.big-raised{font-family:var(--serif);font-size:2.2rem;font-weight:700;line-height:1.1;color:var(--ink)}
:root[data-theme="dark"] .big-raised{color:var(--text)} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .big-raised{color:var(--text)}}

.stat-row div{font-size:.84rem;color:var(--muted)} .stat-row b{display:block;font-size:1.08rem;color:var(--text)}
.organiser{display:flex;gap:.8rem;align-items:center;padding:1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.update{border-left:3px solid var(--wattle);padding:.2rem 0 .2rem 1rem;margin:1rem 0}
.update .person{margin-bottom:.4rem}
.support-list{list-style:none;padding:0;margin:0}
.support-list li{display:grid;grid-template-columns:40px 1fr auto;gap:.8rem;padding:.9rem 0;border-bottom:1px solid var(--line);align-items:start}
.support-list li:last-child{border:none}
.support-list .avatar{width:40px;height:40px;font-size:.85rem}
.support-list q{display:block;color:var(--text);margin-top:.2rem;quotes:"\201C" "\201D"}
.mobile-cta{display:none}
@media (max-width:920px){.mobile-cta{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));gap:.8rem;align-items:center;box-shadow:0 -8px 24px -12px rgba(10,22,38,.25)} .mobile-cta .btn{flex:1} .has-mcta{padding-bottom:80px}}
details.faq{border-bottom:1px solid var(--line);padding:1rem 0}
details.faq summary{cursor:pointer;font-weight:700;font-size:1.06rem;list-style:none;display:flex;justify-content:space-between;gap:1rem}
details.faq summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--muted)}
details.faq[open] summary::after{content:"−"}
details.faq summary::-webkit-details-marker{display:none}
.chip{display:inline-flex;align-items:center;gap:.3rem;border:1.5px solid var(--line-2);border-radius:8px;padding:.4rem .85rem;font-weight:600;font-size:.92rem;background:var(--surface);cursor:pointer;color:var(--text);text-decoration:none;min-height:38px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.diff{font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.9rem 1.05rem;margin-bottom:.65rem}
.mail .meta{font-size:.82rem;color:var(--muted)}
.receipt{border:1px solid var(--line);border-radius:10px;padding:1.4rem;background:var(--surface);position:relative;overflow:hidden}
.receipt .wm{position:absolute;right:-34px;top:22px;transform:rotate(18deg);background:var(--warn-soft);color:var(--warn);font-weight:700;padding:.2rem 3rem;font-size:.86rem}
.cause-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.35rem}

const KEY = 'acf-prototype-v5';
let S, session;
function load() {
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : null; } catch (e) { S = null; }
  if (!S || S.v !== 5) S = seed();
  try { session = JSON.parse(localStorage.getItem(KEY + '-session') || 'null'); } catch (e) { session = null; }
  if (!session) session = { userId: null, orgId: null, wtDone: {} };
  tick();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(KEY + '-session', JSON.stringify(session)); } catch (e) { } }
function resetData() { S = seed(); session = { userId: null, orgId: null, wtDone: {} }; save(); location.hash = '#/'; render(); toast('Sample data restored'); }
function tick() { // time-based transitions
  for (const c of S.campaigns) {
    if (c.status === 'scheduled' && c.start <= now()) c.status = 'active';
    if (c.status === 'active' && c.end && c.end < now()) c.status = 'closed';
  }
}

function vInvite(id) {

}
FORM.acceptInvite = (d, f) => {
  if (!validate(f, [['name', v => v.length > 1, 'Enter your name'], ['target', v => +v > 0, 'Enter a target above $0']])) return;
  const inv = S.invitations.find(i => i.id === d.id); const parent = camp(inv.campaignId);
  let u = S.users.find(x => x.email.toLowerCase() === inv.email.toLowerCase());

  const title = d.name.trim().split(' ')[0] + ' fundraises for ' + org(parent.orgId).name;

  if (tab === 'details') body = `<form class="panel" data-form="campDetails" novalidate><input type="hidden" name="id" value="${c.id}"><fieldset style="border:none;padding:0;margin:0" ${ro}><label class="f">Campaign name<span class="hint"><span data-count="title">${c.title.length}</span>/80 characters</span><input name="title" maxlength="80" value="${esc(c.title)}" data-input="count"></label><label class="f">Summary<span class="hint"><span data-count="summary">${c.summary.length}</span>/160 characters. Shown on cards and search.</span><input name="summary" maxlength="160" value="${esc(c.summary)}" data-input="count"></label>
    <div class="grid3"><label class="f">Target (AUD)<input name="target" inputmode="numeric" value="${c.target ? c.target / 100 : ''}"></label><label class="f">Start date<input type="date" name="start" value="${isoD(c.start)}"></label><label class="f">End date (optional)<input type="date" name="end" value="${c.end ? isoD(c.end) : ''}"></label></div>
    <label class="f">Cause<select name="cause">${CAUSES.map(x => `<option ${x === (c.cause || o.cause) ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    <label class="f">Who this helps<input name="beneficiaries" value="${esc(c.beneficiaries)}"></label><label class="f">Activities the money funds<input name="activities" value="${esc(c.activities)}"></label><button class="btn btn-primary">Save changes</button></fieldset></form>`;
  if (tab === 'story') body = `<form class="panel" data-form="campStory" novalidate><input type="hidden" name="id" value="${c.id}"><fieldset style="border:none;padding:0;margin:0" ${ro}><label class="f">Story<textarea name="story" style="min-height:180px">${esc(c.story)}</textarea></label><label class="f">Video link (optional)<input name="video" value="${esc(c.video)}" placeholder="https://"></label><label class="f">Gallery images<span class="hint">Up to 5 images. ${c.gallery.length} on file${c.gallery.length ? ': ' + c.gallery.map(esc).join(', ') : ''}.</span><input type="file" name="gallery" accept="image/*" multiple></label><div style="height:140px;position:relative;border-radius:12px;overflow:hidden;margin-bottom:1rem">${coverSVG(c.id.length * 13 + c.id.charCodeAt(1) * 3, o.colors[0], o.colors[1], 'Cover preview')}</div><p class="tiny muted">The illustration follows the organisation's cause. ACF can swap in approved photography later.</p><button class="btn btn-primary">Save changes</button></fieldset></form>`;
  if (tab === 'giving') body = `<form class="panel" data-form="campGiving" novalidate><input type="hidden" name="id" value="${c.id}"><fieldset style="border:none;padding:0;margin:0" ${ro}><label class="f">Page address<span class="hint">australiacares.example/c/<b>${esc(c.slug)}</b></span><input name="slug" value="${esc(c.slug)}"></label><label class="f">Preset amounts (AUD, comma separated)<input name="presets" value="${c.presets.map(p => p / 100).join(', ')}"></label><label class="check"><input type="checkbox" name="monthly" ${c.monthly ? 'checked' : ''}>Allow monthly gifts</label><label class="check"><input type="checkbox" name="costCover" ${c.costCover ? 'checked' : ''}>Offer donors the optional cost contribution</label><label class="check"><input type="checkbox" name="showDonors" ${c.showDonors !== false ? 'checked' : ''}>Show recent gifts on the page (anonymous donors stay hidden)</label><label class="f">Thank-you message<textarea name="thanks">${esc(c.thanks)}</textarea></label><button class="btn btn-primary">Save changes</button> <button type="button" class="btn btn-ghost" data-act="thanksPreview" data-id="${c.id}">Preview thank-you email</button></fieldset></form>`;
  if (tab === 'supporters') body = pP2P(c, o);
  if (tab === 'report') { const avg = ds.length ? sum(ds, net) / ds.length : 0; const viaKids = sum(ds.filter(d => d.childId), net); body = `<div class="kpis">${kpi(money(raised), 'Total raised', true)}${kpi(ds.length, 'Donations')}${kpi(money(Math.round(avg)), 'Average gift')}${kpi(money(viaKids), 'Through supporter pages')}${kpi(ds.filter(d => d.freq === 'monthly').length, 'Monthly gifts')}</div>${table([{ h: 'Date', f: d => fmtD(d.createdAt) }, { h: 'Donor', f: d => esc(donorName(d)) + (d.anonymous ? ' <span class="badge">Anonymous publicly</span>' : '') }, { h: 'Via', f: d => d.childId ? esc(camp(d.childId).title) : 'Campaign page' }, { h: 'Gift', num: 1, f: d => money(d.base) }], ds.slice().reverse(), { emptyTitle: 'No donations yet', emptyBody: '' })}`; }
  return ptitle(esc(c.title || 'Untitled campaign'), `${badge(c.status)} ${money(raised)} raised of ${money(c.target)}`, `<a class="btn btn-ghost" href="#/c/${c.slug}">Preview page</a>${canOrg('campaigns') ? actions.join('') : ''}`) +
    `<div class="tabs" role="tablist">${T('details', 'Details')}${T('story', 'Story and media')}${T('giving', 'Giving settings')}${T('supporters', 'Supporter fundraising')}${T('report', 'Report')}</div>${body}`;
}
INP.count = el => { const s = $(`[data-count="${el.name}"]`); if (s) s.textContent = el.value.length; };
FORM.campDetails = (d, f) => { const c = camp(d.id); if (!validate(f, [['title', v => v.length > 0, 'Give the campaign a name'], ['summary', v => v.length > 0, 'Add a short summary'], ['target', v => +v > 0, 'Target must be a positive amount'], ['start', v => v, 'Choose a start date'], ['end', v => !v || new Date(v) > new Date(d.start), 'End date must be after the start date']])) return; const prevT = c.target; Object.assign(c, { title: d.title.trim(), summary: d.summary.trim(), target: Math.round(+d.target * 100), start: new Date(d.start).getTime(), end: d.end ? new Date(d.end).getTime() + DAY - 1 : null, cause: d.cause, beneficiaries: d.beneficiaries, activities: d.activities }); if (c.status === 'draft' && c.slug.startsWith('new-campaign')) { let s = slugify(c.title); while (S.campaigns.some(x => x.slug === s && x.id !== c.id)) s += '-2'; c.slug = s; } if (prevT !== c.target) audit('Campaign', c.id, 'Target changed', money(prevT), money(c.target)); toast('Changes saved. Existing donations are unchanged.'); render(); };

FORM.campGiving = (d, f) => { const c = camp(d.id); const slug = slugify(d.slug); const presets = d.presets.split(',').map(x => Math.round(parseFloat(x) * 100)).filter(x => x > 0); if (!validate(f, [['slug', () => slug.length > 2, 'Use at least 3 letters or numbers'], ['slug', () => !S.campaigns.some(x => x.slug === slug && x.id !== c.id), 'Another page already uses this address'], ['presets', () => presets.length >= 1 && presets.length <= 6, 'Enter between 1 and 6 amounts']])) return; Object.assign(c, { slug, presets, monthly: !!d.monthly, costCover: !!d.costCover, showDonors: !!d.showDonors, thanks: d.thanks }); toast('Changes saved'); render(); };

function publishBlockers(c) { const o = org(c.orgId); const r = []; if (o.status !== 'approved') r.push('Your organisation must be approved by ACF before anything is published'); if (o.suspended) r.push('Your organisation is suspended'); if (!c.title) r.push('Add a campaign name'); if (!c.summary) r.push('Add a summary'); if (!(c.target > 0)) r.push('Set a positive target'); if (c.end && c.end < now()) r.push('The end date has passed'); return r; }
ACT.campPublish = el => { const c = camp(el.dataset.id); const b = publishBlockers(c); if (b.length) { modal(`${mHead("Can't publish yet")}<div class="callout bad" role="alert"><ul style="margin:0;padding-left:1.1rem">${b.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>${b[0].startsWith('Your organisation must') ? '<a class="btn btn-primary" href="#/portal/onboarding" data-act="close">Go to onboarding</a>' : '<button class="btn btn-ghost" data-act="close">Back to editing</button>'}`); return; } const to = c.start > now() ? 'scheduled' : 'active'; confirmBox(to === 'scheduled' ? 'Schedule this campaign?' : 'Publish this campaign?', to === 'scheduled' ? `It will go live on ${fmtD(c.start)}.` : 'It will be visible to the public and searchable straight away.', to === 'scheduled' ? 'Schedule' : 'Publish', () => { c.status = to; audit('Campaign', c.id, to === 'scheduled' ? 'Scheduled' : 'Published', 'draft', to); toast(to === 'scheduled' ? 'Scheduled' : 'Published. Your campaign is live.'); render(); }); };
ACT.campStatus = el => { const c = camp(el.dataset.id); const to = el.dataset.to; const L = { paused: ['Pause this campaign?', 'Donations stop until you resume. Existing gifts are kept.', 'Pause'], closed: ['Close this campaign?', 'Giving stops for good. Past gifts and totals stay on record.', 'Close campaign'], active: ['Resume this campaign?', 'Donations will open again.', 'Resume'], draft: ['Move back to draft?', 'The scheduled launch is cancelled.', 'Unschedule'] }[to]; confirmBox(L[0], L[1], L[2], () => { const p = c.status; c.status = to; if (to === 'closed' && (!c.end || c.end > now())) c.end = now(); audit('Campaign', c.id, L[2], p, to); toast(L[2] === 'Close campaign' ? 'Closed' : L[2] === 'Pause' ? 'Paused' : L[2] === 'Resume' ? 'Resumed' : 'Unscheduled'); render(); }, to === 'closed'); };
ACT.campExtend = el => { const c = camp(el.dataset.id); modal(`${mHead('Extend end date')}<form data-form="extend"><input type="hidden" name="id" value="${c.id}"><label class="f">New end date<input type="date" name="end" min="${isoD(now() + DAY)}"></label><label class="f">Reason<input name="why"></label><button class="btn btn-primary">Reopen campaign</button></form>`); };
FORM.extend = (d, f) => { if (!validate(f, [['end', v => v && new Date(v) > new Date(), 'Choose a date in the future'], ['why', v => v, 'Add a reason']])) return; const c = camp(d.id); const p = fmtD(c.end); c.end = new Date(d.end).getTime() + DAY - 1; c.status = 'active'; audit('Campaign', c.id, 'Extension approved', p, fmtD(c.end), d.why); closeLayer(); toast('Extended to ' + fmtD(c.end)); render(); };

/* ===== P2P01, P2P05 ===== */
function pP2P(c, o) {
  S.invitations.forEach(i => { if (i.status === 'sent' && i.expiresAt < now()) i.status = 'expired'; });
  const inv = S.invitations.filter(i => i.campaignId === c.id); const kids = S.campaigns.filter(x => x.parentId === c.id);
  if (!c.p2p) return `<div class="panel"><h3>Supporter fundraising is off</h3><p>Turn it on to invite supporters to create their own pages under this campaign. Their totals add to this campaign. Payouts still go only to ${esc(o.name)}.</p>${canOrg('campaigns') ? `<button class="btn btn-primary" data-act="p2pOn" data-id="${c.id}">Turn on supporter fundraising</button>` : ''}</div>`;
  return `<div class="two-col"><div><h3>Supporter pages</h3>${table([{ h: 'Page', f: k => `<a href="#/c/${k.slug}">${esc(k.title)}</a><div class="small muted">${esc(userById(k.supporterId)?.name || '')}</div>` }, { h: 'Status', f: k => k.hidden ? badge('suspended', 'Hidden') : badge(k.status) }, { h: 'Raised', num: 1, f: k => money(raisedFor(k)) + '<div class="small muted">of ' + money(k.target) + '</div>' }, { h: '', f: k => canOrg('campaigns') ? `<button class="btn btn-ghost btn-sm" data-act="kidHide" data-id="${k.id}">${k.hidden ? 'Show' : 'Hide'}</button>` : '' }], kids, { emptyTitle: 'No supporter pages yet', emptyBody: 'Invite supporters to get started.' })}
   <h3 style="margin-top:1.4rem">Invitations</h3>${table([{ h: 'Supporter', f: i => esc(i.name) + `<div class="small muted">${esc(i.email)}</div>` }, { h: 'Status', f: i => badge(i.status) }, { h: 'Sent', f: i => fmtD(i.sentAt) + `<div class="small muted">${i.status === 'sent' ? 'Expires ' + fmtD(i.expiresAt) : ''}</div>` }, { h: '', f: i => canOrg('campaigns') && ['sent', 'expired'].includes(i.status) ? `<button class="btn btn-ghost btn-sm" data-act="invResend" data-id="${i.id}">Resend</button>${i.status === 'sent' ? ` <button class="btn btn-ghost btn-sm" data-act="invRevoke" data-id="${i.id}">Revoke</button>` : ''}` : '' }], inv, { emptyTitle: 'No invitations sent', emptyBody: '' })}</div>
   <aside class="panel"><h3>Invite a supporter</h3>${c.status === 'draft' ? '<p class="small muted">Supporters can set up pages now, but they can only publish once this campaign is live.</p>' : ''}${canOrg('campaigns') ? `<form data-form="invite" novalidate><input type="hidden" name="cid" value="${c.id}"><label class="f">Name<input name="name"></label><label class="f">Email<input name="email" type="email"></label><button class="btn btn-primary">Send invitation</button></form><p class="tiny muted" style="margin-top:.6rem">Invitations expire after 14 days. The email appears in the message centre.</p>` : '<p class="small muted">Only campaign editors and owners can invite supporters.</p>'}</aside></div>`;
}
ACT.p2pOn = el => { const c = camp(el.dataset.id); c.p2p = true; audit('Campaign', c.id, 'Supporter fundraising enabled', 'off', 'on'); render(); };
FORM.invite = (d, f) => { if (!validate(f, [['name', v => v.length > 1, 'Enter a name'], ['email', isEmail, 'Enter a valid email'], ['email', v => !S.invitations.some(i => i.campaignId === d.cid && i.email.toLowerCase() === v.toLowerCase() && ['sent', 'accepted'].includes(i.status)), 'This person already has an invitation or page']])) return; const c = camp(d.cid); const inv = { id: uid('inv'), campaignId: c.id, name: d.name.trim(), email: d.email.trim(), status: 'sent', sentAt: now(), expiresAt: now() + 14 * DAY }; S.invitations.push(inv); mail(inv.email, 'Supporter invitation', `${org(c.orgId).name} invited you to fundraise`, `Create your own page for ${c.title}. This invitation expires ${fmtD(inv.expiresAt)}.`, { act: 'openInvite', id: inv.id, label: 'Accept invitation' }); audit('Invitation', inv.id, 'Invitation sent', '', 'sent'); toast('Invitation sent'); render(); };
ACT.invResend = el => { const i = S.invitations.find(x => x.id === el.dataset.id); i.status = 'sent'; i.sentAt = now(); i.expiresAt = now() + 14 * DAY; mail(i.email, 'Supporter invitation', 'Reminder: you are invited to fundraise', 'This invitation now expires ' + fmtD(i.expiresAt) + '.', { act: 'openInvite', id: i.id, label: 'Accept invitation' }); toast('Invitation resent'); render(); };
ACT.invRevoke = el => { const i = S.invitations.find(x => x.id === el.dataset.id); confirmBox('Revoke this invitation?', 'The link will stop working.', 'Revoke', () => { i.status = 'revoked'; audit('Invitation', i.id, 'Revoked', 'sent', 'revoked'); toast('Invitation revoked'); render(); }, true); };
ACT.kidHide = el => { const k = camp(el.dataset.id); confirmBox(k.hidden ? 'Show this supporter page?' : 'Hide this supporter page?', k.hidden ? 'It will be visible again.' : 'The page is removed from public view. Gifts already made are kept.', k.hidden ? 'Show page' : 'Hide page', () => { k.hidden = !k.hidden; audit('Supporter page', k.id, k.hidden ? 'Hidden by organisation' : 'Shown', '', ''); render(); }); };

/* ===== donations ===== */
function pDonations(o, R) {
  const q = (R.q.get('q') || '').toLowerCase(), st = R.q.get('st') || '', cid = R.q.get('c') || '';
  const list = S.donations.filter(d => d.orgId === o.id && d.status !== 'processing').filter(d => (!q || (d.first + ' ' + d.last + ' ' + d.ref).toLowerCase().includes(q)) && (!st || d.status === st) && (!cid || d.campaignId === cid || d.childId === cid)).sort((a, b) => b.createdAt - a.createdAt);
  ui.lastDonExport = list.map(d => d.id);
  return ptitle('Donations', esc(o.name), `<button class="btn btn-ghost" data-act="exportOrgDons">Export CSV</button>`) +
    `<form class="toolbar" data-form="orgDonFilter"><input name="q" value="${esc(R.q.get('q') || '')}" placeholder="Search name or reference" aria-label="Search"><select name="st" aria-label="Status"><option value="">All statuses</option>${['succeeded', 'pending_transfer', 'failed', 'cancelled'].map(s => `<option value="${s}" ${s === st ? 'selected' : ''}>${BADGE[s][0]}</option>`).join('')}</select><select name="c" aria-label="Campaign"><option value="">All campaigns</option>${S.campaigns.filter(c => c.orgId === o.id).map(c => `<option value="${c.id}" ${c.id === cid ? 'selected' : ''}>${esc(c.title || 'Untitled')}</option>`).join('')}</select><button class="btn btn-primary btn-sm">Filter</button>${q || st || cid ? '<a class="btn-link small" href="#/portal/donations">Clear</a>' : ''}<span class="muted small">${list.length} rows</span></form>` +
    table([{ h: 'Date', f: d => fmtD(d.createdAt) }, { h: 'Reference', f: d => d.ref }, { h: 'Donor', f: d => esc(donorName(d)) + (d.anonymous ? ' <span class="badge">Anonymous publicly</span>' : '') }, { h: 'For', f: d => d.childId ? esc(camp(d.childId).title) : d.campaignId ? esc(camp(d.campaignId).title) : 'General' }, { h: 'Gift', num: 1, f: d => money(d.base) }, { h: 'ACF 4%', num: 1, f: d => money(-Math.round(d.base * d.rate / 100)) }, { h: 'Your allocation', num: 1, f: d => money(d.allocation) }, { h: 'Status', f: d => badge(d.refund?.status === 'refunded' ? 'refunded' : d.status) + (d.settled ? ' <span class="badge b-ok">Paid out</span>' : '') }], list, { emptyTitle: 'No donations match', emptyBody: 'Change or clear the filters.', emptyCta: '<a class="btn btn-ghost" href="#/portal/donations">Clear filters</a>' }) +
    `<p class="tiny muted" style="margin-top:.8rem">Donor contact details are shared under the disclosure policy ACF confirms. Emails are hidden in this prototype.</p>`;
}
FORM.orgDonFilter = d => { const n = new URLSearchParams(); Object.entries(d).forEach(([k, v]) => v && n.set(k, v)); nav('#/portal/donations?' + n); };
ACT.exportOrgDons = () => { const rows = ui.lastDonExport.map(don); download(`donations-${org(session.orgId).slug}.csv`, csv([['date', 'reference', 'donor', 'anonymous_publicly', 'campaign', 'gift_aud', 'acf_retention_aud', 'allocation_aud', 'status'], ...rows.map(d => [isoD(d.createdAt), d.ref, d.first + ' ' + d.last, d.anonymous ? 'yes' : 'no', d.childId ? camp(d.childId).title : d.campaignId ? camp(d.campaignId).title : 'General', (d.base / 100).toFixed(2), (Math.round(d.base * d.rate / 100) / 100).toFixed(2), (d.allocation / 100).toFixed(2), d.status])]), 'Donations export'); };

/* ===== payouts & statements ===== */
function pPayouts(o) {
  const b = balances(o.id); const blocks = payoutBlocks(o.id); const batches = S.payouts.filter(p => p.items.some(i => i.orgId === o.id)).sort((a, b) => b.createdAt - a.createdAt);
  return ptitle('Payouts and statements', `${esc(o.name)}. ACF pays out ${S.settings.payoutCycle}.`) +
    `<div class="kpis">${kpi(money(b.available), 'Available for next payout', true)}${kpi(money(b.pending), 'Pending (not yet cleared)')}${kpi(money(b.reserved), 'In a scheduled payout')}${kpi(money(b.paid), 'Paid to date')}${kpi(money(b.retained), 'Kept by ACF (4%)')}</div>
    ${b.recovery ? `<div class="callout bad">A refund after payout created a recovery of ${money(b.recovery)}. It will be deducted from your next payout.</div>` : ''}
    <div class="panel"><h3>Next payout: ${fmtD(nextPayoutDate())}</h3>${blocks.length ? `<p class="small">Your organisation won't be included until these are resolved:</p><ul class="small">${blocks.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p class="small">${badge('approved', 'Eligible')} ${money(b.available)} is ready for the next payout batch.</p>`}<p class="tiny muted">Pending gifts (bank transfers not yet matched, offline batches not yet paid) only become available once cleared. Processing costs are to be confirmed.</p></div>
    <h3 style="margin-top:1.4rem">Payout statements</h3>` +
    table([{ h: 'Batch', f: p => p.ref }, { h: 'Created', f: p => fmtD(p.createdAt) }, { h: 'Status', f: p => badge(p.status === 'approved' ? 'approved_batch' : p.status) }, { h: 'Gifts', num: 1, f: p => p.items.find(i => i.orgId === o.id).donationIds.length }, { h: 'Amount', num: 1, f: p => money(p.items.find(i => i.orgId === o.id).cents) }], batches, { href: p => '#/portal/statement/' + p.id, emptyTitle: 'No payouts yet', emptyBody: 'Statements appear here after your first payout.' });
}
function statementRows(p, oid) { const it = p.items.find(i => i.orgId === oid); return { it, ds: it.donationIds.map(don).filter(Boolean) }; }
function statementView(p, oid, back) {
  const { it, ds } = statementRows(p, oid); const o = org(oid);
  return ptitle(`Statement ${p.ref}`, `${esc(o.name)}. ${badge(p.status === 'approved' ? 'approved_batch' : p.status)} ${p.settledAt ? 'Settled ' + fmtD(p.settledAt) + ', bank reference ' + p.settlementRef : ''}`, `<a class="btn btn-ghost" href="${back}">Back</a><button class="btn btn-primary" data-act="dlStatement" data-p="${p.id}" data-o="${oid}">Download CSV</button>`) +
    `<div class="kpis">${kpi(money(sum(ds, d => d.base)), 'Gifts included')}${kpi(money(sum(ds, d => d.contribution)), 'Donor cost contributions')}${kpi(money(-sum(ds, d => Math.round(d.base * d.rate / 100))), 'ACF retention (4%)')}${it.adjustment ? kpi(money(-it.adjustment), 'Refund recovery') : ''}${kpi(money(it.cents), 'Paid to your account', true)}</div>` +
    table([{ h: 'Date', f: d => fmtD(d.createdAt) }, { h: 'Reference', f: d => d.ref }, { h: 'Campaign', f: d => d.childId ? esc(camp(d.childId).title) : d.campaignId ? esc(camp(d.campaignId).title) : 'General' }, { h: 'Gift', num: 1, f: d => money(d.base) }, { h: 'Contribution', num: 1, f: d => money(d.contribution) }, { h: 'ACF 4%', num: 1, f: d => money(-Math.round(d.base * d.rate / 100)) }, { h: 'Processing', num: 1, f: () => '<span class="muted">TBC</span>' }, { h: 'Allocated', num: 1, f: d => money(d.allocation) }], ds) + `<p class="tiny muted" style="margin-top:.6rem">Processing costs are not modelled until ACF confirms who absorbs them.</p>`;

    <div class="two-col"><div class="panel"><h3>Paid donations per day</h3><div style="display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:1rem" role="img" aria-label="Bar chart of paid donations per day">${buckets.map(b => `<div title="${fmtD(b.d)}: ${money(b.v)}" style="flex:1;background:${b.v ? 'linear-gradient(180deg,#7B5CFA,#3BA7FF)' : 'var(--surface-2)'};height:${Math.max(3, b.v / mx * 100)}%;border-radius:6px 6px 2px 2px"></div>`).join('')}</div><div class="row small muted" style="justify-content:space-between;margin-top:.3rem"><span>${fmtD(buckets[0].d)}</span><span>Today</span></div></div>

  const q = (R.q.get('q') || '').toLowerCase(), st = R.q.get('st') || '', oid = R.q.get('o') || '', m = R.q.get('m') || '';
  const list = S.donations.filter(d => (!q || (d.ref + ' ' + d.first + ' ' + d.last + ' ' + d.email).toLowerCase().includes(q)) && (!st || d.status === st) && (!oid || d.orgId === oid) && (!m || d.method === m)).sort((a, b) => b.createdAt - a.createdAt);
  ui.lastAdmDon = list.map(d => d.id);
  return ptitle('Donations', `${list.length} records`, `<button class="btn btn-ghost" data-act="exportAdmDons">Export CSV</button>`) + `<form class="toolbar" data-form="aDonFilter"><input name="q" value="${esc(R.q.get('q') || '')}" placeholder="Reference, name or email" aria-label="Search"><select name="st" aria-label="Status"><option value="">All statuses</option>${['succeeded', 'processing', 'pending_transfer', 'failed', 'cancelled'].map(s => `<option value="${s}" ${s === st ? 'selected' : ''}>${BADGE[s][0]}</option>`).join('')}</select><select name="o" aria-label="Recipient"><option value="">All recipients</option>${S.orgs.map(o => `<option value="${o.id}" ${o.id === oid ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}<option value="ACF" ${oid === 'ACF' ? 'selected' : ''}>ACF</option></select><select name="m" aria-label="Method"><option value="">All methods</option>${Object.entries(METHOD).map(([x, t]) => `<option value="${x}" ${x === m ? 'selected' : ''}>${t}</option>`).join('')}</select><button class="btn btn-primary btn-sm">Filter</button>${q || st || oid || m ? '<a class="btn-link small" href="#/admin/donations">Clear</a>' : ''}</form>` +
    table([{ h: 'Date', f: d => `<span class="nw">${fmtD(d.createdAt)}</span><div class="tiny muted nw">${new Date(d.createdAt).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' })}</div>` }, { h: 'Ref', f: d => `<span class="nw">${d.ref}</span>` }, { h: 'Donor and recipient', f: d => `<b class="nw">${esc(d.first + ' ' + d.last)}</b><div class="small muted nw">to ${esc(orgName(d.orgId))}</div>` }, { h: 'Charged', num: 1, f: d => money(d.gross) }, { h: 'Retained', num: 1, f: d => money(d.fee) }, { h: 'Allocated', num: 1, f: d => money(d.allocation) }, { h: 'Status', f: d => badge(d.refund?.status === 'refunded' ? 'refunded' : d.status) + (d.refund?.status === 'requested' ? ' ' + badge('pending', 'Refund requested') : '') + `<div class="tiny muted nw" style="margin-top:.2rem">${METHOD[d.method] || d.method}</div>` }], list.slice(0, 200), { href: d => '#/admin/donation/' + d.id, emptyTitle: 'No donations match', emptyBody: '' });
}
FORM.aDonFilter = d => { const n = new URLSearchParams(); Object.entries(d).forEach(([k, v]) => v && n.set(k, v)); nav('#/admin/donations?' + n); };
ACT.exportAdmDons = () => download('acf-donations.csv', csv([['date', 'reference', 'donor', 'email', 'recipient', 'campaign', 'base_aud', 'contribution_aud', 'charged_aud', 'rate_pct', 'retained_aud', 'allocated_aud', 'method', 'status', 'payout_batch'], ...ui.lastAdmDon.map(don).map(d => [isoD(d.createdAt), d.ref, d.first + ' ' + d.last, d.email, orgName(d.orgId), d.campaignId ? camp(d.campaignId).title : '', (d.base / 100).toFixed(2), (d.contribution / 100).toFixed(2), (d.gross / 100).toFixed(2), d.rate, (d.fee / 100).toFixed(2), (d.allocation / 100).toFixed(2), d.method, d.status, S.payouts.find(p => p.id === d.payoutId)?.ref || ''])]), 'Donations export');
function aDonationDetail(R) {
  const d = don(R.parts[2]); if (!d) return empty('Donation not found', '');
  const p = S.payouts.find(x => x.id === d.payoutId); const plan = d.planId ? S.plans.find(x => x.id === d.planId) : null;
  const events = [{ ts: d.createdAt, e: 'Donation created', s: 'processing' }, ...(d.status === 'succeeded' ? [{ ts: d.paidAt || d.createdAt, e: 'payment.succeeded', s: 'Receipt ' + d.receiptNo }] : []), ...(d.status === 'failed' ? [{ ts: d.createdAt, e: 'payment.failed', s: d.failReason || 'Declined' }] : []), ...(d.status === 'pending_transfer' ? [{ ts: d.createdAt, e: 'transfer.awaiting', s: 'Reference ' + d.transferRef }] : []), ...(d.refund ? [{ ts: d.refund.ts, e: 'refund.' + d.refund.status, s: d.refund.reason || '' }] : [])];
  return ptitle('Donation ' + d.ref, `${badge(d.status)} ${testMode()}`, `<a class="btn btn-ghost" href="#/admin/donations">All donations</a>${d.receiptNo ? `<button class="btn btn-ghost" data-act="receipt" data-id="${d.id}">View receipt</button>` : ''}${d.status === 'pending_transfer' ? (canACF('finance') ? `<button class="btn btn-primary" data-act="matchTransfer" data-id="${d.id}">Match transfer</button>` : finOnly('Match')) : ''}${d.status === 'succeeded' && d.refund?.status !== 'refunded' ? (canACF('refund') ? `<button class="btn btn-danger" data-act="refund" data-id="${d.id}">Refund</button>` : finOnly('Refund')) : ''}`) +
    `<div class="grid2" style="gap:1rem"><div class="panel"><h3>Allocation</h3><div class="summary-line"><span>Base gift</span><b>${money(d.base)}</b></div><div class="summary-line"><span>Donor cost contribution</span><b>${money(d.contribution)}</b></div><div class="summary-line"><span>Gross charged</span><b>${money(d.gross)}</b></div><div class="summary-line"><span>Processor fee</span><b class="muted">To be confirmed</b></div><div class="summary-line"><span>ACF retained (rate ${d.rate}% stored on record)</span><b>${money(d.fee)}</b></div><div class="summary-line total"><span>Allocated to ${esc(orgName(d.orgId))}</span><span>${money(d.allocation)}</span></div>${d.orgId === 'ACF' ? '<p class="small muted">Gift to ACF. No external organisation liability.</p>' : ''}
    <h4 style="margin-top:1rem">Ledger</h4><p class="small">${p ? `Included in payout <a href="#/admin/payout/${p.id}">${p.ref}</a> ${badge(p.status === 'approved' ? 'approved_batch' : p.status)}` : d.status === 'succeeded' && d.orgId !== 'ACF' ? 'Not yet in a payout batch. Counted as available.' : 'No payout entry.'}</p>${d.refund?.recovery ? `<p class="small field-error">Refunded after payout. Recovery of ${money(d.allocation)} recorded against the organisation.</p>` : ''}</div>
    <div class="panel"><h3>Donor and gift</h3><div class="summary-line"><span>Donor</span><b>${esc(d.first + ' ' + d.last)}</b></div><div class="summary-line"><span>Email</span><b>${esc(d.email)}</b></div>${d.company ? `<div class="summary-line"><span>Company</span><b>${esc(d.company)}</b></div>` : ''}<div class="summary-line"><span>Public display</span><b>${d.anonymous ? 'Anonymous' : 'Name shown'}</b></div><div class="summary-line"><span>Campaign</span><b>${d.campaignId ? esc(camp(d.campaignId).title) : 'General'}${d.childId ? ' via ' + esc(camp(d.childId).title) : ''}</b></div><div class="summary-line"><span>Method</span><b>${METHOD[d.method] || d.method}</b></div><div class="summary-line"><span>Frequency</span><b>${FREQ[d.freq]}${plan ? ', plan ' + plan.providerRef : ''}</b></div><div class="summary-line"><span>Source</span><b>${SOURCE[d.source] || d.source}</b></div>
    <h4 style="margin-top:1rem">Provider events</h4><ul class="timeline">${events.map(e => `<li><b>${e.e}</b> ${fmtDT(e.ts)}<div class="small muted">${esc(e.s)}</div></li>`).join('')}</ul></div></div>`;
}
ACT.matchTransfer = el => { const d = don(el.dataset.id); confirmBox('Match bank transfer?', `Confirms ${money(d.gross)} was received with reference ${d.transferRef}. The gift becomes paid, counts toward totals and a receipt is issued.`, 'Match and issue receipt', () => { succeed(d); audit('Donation', d.ref, 'Transfer matched', 'pending_transfer', 'succeeded'); toast('Matched. Receipt ' + d.receiptNo + ' issued.'); render(); }); };
ACT.refund = el => { const d = don(el.dataset.id); const p = S.payouts.find(x => x.id === d.payoutId); const inBatch = p && unfinished.includes(p.status); if (inBatch) { modal(`${mHead('Refund blocked')}<div class="callout bad">This gift is reserved in payout ${p.ref}, which is still in progress. Finish or fail that batch before refunding.</div>`); return; } const after = p && p.status === 'settled'; confirmBox('Refund ' + d.ref + '?', `${money(d.gross)} goes back to the donor (simulated). ${after ? `<b>This gift was already paid out</b>, so a recovery of ${money(d.allocation)} will be recorded against ${esc(orgName(d.orgId))} and deducted from its next payout.` : 'The gift is removed from the organisation\u2019s available balance.'}`, 'Refund', reason => { d.refund = { status: 'refunded', ts: now(), reason, recovery: after }; if (after) org(d.orgId).recovery += d.allocation; S.support.filter(s => s.donationId === d.id && s.status === 'open').forEach(s => { s.status = 'resolved'; s.resolution = 'Refunded'; }); audit('Donation', d.ref, 'Refunded', 'succeeded', 'refunded', reason); mail(d.email, 'Refund', 'Your gift ' + d.ref + ' has been refunded', money(d.gross) + ' will return to your account (simulated).'); toast('Refunded'); render(); }, true, true); };

/* IMP03 + transfer matching */
function aMatching() {
  const tr = S.donations.filter(d => d.status === 'pending_transfer'); const im = S.imports.filter(i => i.status === 'awaiting_payment');
  const fin = canACF('finance');
  return ptitle('Transfers and offline batches', 'Funds only become paid once matched against the bank. Receipts follow matching.') +
    `<h3>Bank transfers from donors</h3>` + table([{ h: 'Date', f: d => fmtD(d.createdAt) }, { h: 'Reference', f: d => d.transferRef }, { h: 'Donor', f: d => esc(d.first + ' ' + d.last) }, { h: 'For', f: d => esc(orgName(d.orgId)) }, { h: 'Amount', num: 1, f: d => money(d.gross) }, { h: '', f: d => fin ? `<button class="btn btn-primary btn-sm" data-act="matchTransfer" data-id="${d.id}">Match</button>` : finOnly('Match') }], tr, { emptyTitle: 'No transfers waiting', emptyBody: '' }) +
    `<h3 style="margin-top:1.6rem">Offline donation batches</h3>` + table([{ h: 'Batch', f: i => i.ref }, { h: 'Organisation', f: i => esc(org(i.orgId).name) }, { h: 'Rows', num: 1, f: i => i.rows.length }, { h: 'Total', num: 1, f: i => money(i.total) }, { h: 'Status', f: i => badge(i.status) }, { h: '', f: i => i.status === 'awaiting_payment' ? (fin ? `<button class="btn btn-primary btn-sm" data-act="matchImport" data-id="${i.id}">Match payment</button>` : finOnly('Match')) : '' }], S.imports.slice().sort((a, b) => b.createdAt - a.createdAt), { emptyTitle: 'No batches', emptyBody: '' }) + (im.length ? '' : '');
}
ACT.matchImport = el => { const i = S.imports.find(x => x.id === el.dataset.id); confirmBox('Match ' + i.ref + '?', `Confirms ${money(i.total)} was received from ${esc(org(i.orgId).name)}. ${i.rows.length} donations are recorded as paid and receipts are issued.`, 'Match and issue receipts', () => { i.donationIds = []; for (const r of i.rows) { const d = mkDon(S, { orgId: i.orgId, campaignId: r.campaignId, first: r.first, last: r.last, email: r.email, base: r.amount, method: 'offline', source: 'offline', status: 'processing', createdAt: new Date(r.date).getTime() + 12 * 3600e3, importId: i.id }); d.ref = 'ACF-' + (++S.seq.don); S.donations.push(d); succeed(d); i.donationIds.push(d.id); } i.status = 'matched'; i.matchedAt = now(); audit('Offline batch', i.ref, 'Payment matched', 'awaiting_payment', 'matched'); toast(i.rows.length + ' donations recorded and receipted'); render(); }); };

/* ADM06 */
function aRecurring() {
  const card = p => `<div class="panel"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3 style="margin:0">${money(p.base + p.contribution)} monthly</h3><div class="small muted">${esc(p.first + ' ' + p.last)} to ${esc(orgName(p.orgId))}${p.campaignId ? ', ' + esc(camp(p.campaignId).title) : ''}</div></div>${badge(p.status)}</div>
    <div class="summary-line" style="margin-top:.8rem"><span>Method</span><b>${METHOD[p.method] || p.method}</b></div><div class="summary-line"><span>Provider reference</span><b>${p.providerRef}</b></div><div class="summary-line"><span>Next charge</span><b>${p.status === 'cancelled' ? 'None' : fmtD(p.nextCharge)}</b></div>
    <div class="summary-line"><span>Recent charges</span><span class="row" style="gap:.3rem">${p.attempts.slice(-6).map(a => `<span class="dot" title="${fmtD(a.ts)}: ${a.result === 'paid' ? 'Paid' : 'Failed'}" style="width:12px;height:12px;margin:0;background:${a.result === 'paid' ? 'var(--gum)' : 'var(--danger)'}"></span>`).join('')}</span></div>
    ${p.status !== 'cancelled' ? `<div class="row" style="margin-top:1rem"><button class="btn btn-primary btn-sm" data-act="planCharge" data-id="${p.id}" data-v="ok">Charge now</button><button class="btn btn-ghost btn-sm" data-act="planCharge" data-id="${p.id}" data-v="fail">Simulate failure</button><button class="btn btn-ghost btn-sm" data-act="planAdminCancel" data-id="${p.id}">Cancel plan</button></div>` : ''}</div>`;
  return ptitle('Monthly gifts', 'Simulate the next charge to see successful and failed renewals. A failed renewal never adds income.') + (S.plans.length ? `<div class="grid2" style="gap:1rem">${S.plans.map(card).join('')}</div><p class="tiny muted" style="margin-top:.8rem"><span class="dot" style="background:var(--gum)"></span>Paid <span class="dot" style="background:var(--danger);margin-left:.8rem"></span>Failed, no income recorded</p>` : `<div class="panel">${empty('No monthly gifts yet', 'They appear here when donors choose Monthly at checkout.')}</div>`);
}
ACT.planCharge = el => { const p = S.plans.find(x => x.id === el.dataset.id); const okk = el.dataset.v === 'ok'; const d = mkDon(S, { orgId: p.orgId, campaignId: p.campaignId, first: p.first, last: p.last, email: p.email, donorUserId: p.donorUserId, base: p.base, contribution: p.contribution, method: p.method, status: 'processing', freq: 'monthly', planId: p.id }); d.ref = 'ACF-' + (++S.seq.don); S.donations.push(d); const prev = p.status; if (okk) { succeed(d); p.status = p.status === 'cancel_requested' ? p.status : 'active'; p.nextCharge = now() + 30 * DAY; } else { d.status = 'failed'; d.failReason = 'Renewal declined (simulated)'; p.status = 'payment_issue'; mail(p.email, 'Monthly payment failed', 'We could not process your monthly gift', 'No money was taken. Please update your payment details in your account.'); } p.attempts.push({ ts: now(), result: okk ? 'paid' : 'failed', donationId: d.id, note: okk ? '' : 'Renewal declined (simulated)' }); audit('Recurring plan', p.id, okk ? 'Renewal paid' : 'Renewal failed', prev, p.status); toast(okk ? 'Renewal paid: ' + d.ref : 'Renewal failed. Plan marked as payment issue. No income recorded.', !okk); render(); };
ACT.planAdminCancel = el => { const p = S.plans.find(x => x.id === el.dataset.id); confirmBox('Cancel this monthly gift?', 'Records a support action and stops future charges.', 'Cancel monthly gift', reason => { const prev = p.status; p.status = 'cancelled'; S.support.filter(s => s.planId === p.id && s.status === 'open').forEach(s => { s.status = 'resolved'; s.resolution = 'Cancelled by ACF: ' + reason; }); audit('Recurring plan', p.id, 'Cancelled by ACF', prev, 'cancelled', reason); mail(p.email, 'Monthly gift cancelled', 'Your monthly gift has been cancelled', 'No further payments will be taken.'); render(); }, true, true); };

/* ADM07 payouts */
function aPayouts() {
  const elig = S.orgs.filter(o => o.status === 'approved' || o.suspended).map(o => ({ o, b: balances(o.id), blocks: payoutBlocks(o.id) }));
  const canBuild = canACF('build_payout');
  return ptitle('Payouts', `Cycle: ${S.settings.payoutCycle}. Next payout date ${fmtD(nextPayoutDate())}. ${S.settings.twoPerson ? 'Two-person approval is on.' : ''}`) +
    `<div class="kpis">${kpi(money(sum(elig, x => x.b.available)), 'Available across organisations', true)}${kpi(money(sum(elig, x => x.b.reserved)), 'Reserved in open batches')}${kpi(money(sum(elig, x => x.b.pending)), 'Pending, not cleared')}${kpi(money(sum(S.payouts.filter(p => p.status === 'settled'), p => sum(p.items, i => i.cents))), 'Settled to date')}</div>
    <div class="panel"><h3>Build a payout batch</h3><p class="small muted">Only cleared, unreserved allocations for eligible organisations can be selected.</p><form data-form="buildBatch">${table([{ h: '', f: x => `<input type="checkbox" name="o_${x.o.id}" ${x.blocks.length ? 'disabled' : 'checked'} aria-label="Include ${esc(x.o.name)}">` }, { h: 'Organisation', f: x => esc(x.o.name) }, { h: 'Available', num: 1, f: x => money(x.b.available) + (x.b.recovery ? `<div class="small field-error">after ${money(x.b.recovery)} recovery</div>` : '') }, { h: 'Reserved', num: 1, f: x => money(x.b.reserved) }, { h: 'Eligibility', f: x => x.blocks.length ? `<span class="small field-error">${x.blocks.map(esc).join('. ')}</span>` : badge('approved', 'Eligible') }], elig)}<div class="row" style="margin-top:1rem">${canBuild ? '<button class="btn btn-primary">Create batch for approval</button>' : finOnly('Create batch')}</div></form></div>
    <h3 style="margin-top:1.4rem">Batches</h3>` + table([{ h: 'Batch', f: p => p.ref }, { h: 'Created', f: p => fmtD(p.createdAt) + `<div class="small muted">by ${esc(userById(p.createdBy)?.name || '')}</div>` }, { h: 'Organisations', num: 1, f: p => p.items.length }, { h: 'Total', num: 1, f: p => money(sum(p.items, i => i.cents)) }, { h: 'Status', f: p => badge(p.status === 'approved' ? 'approved_batch' : p.status) }], S.payouts.slice().sort((a, b) => b.createdAt - a.createdAt), { href: p => '#/admin/payout/' + p.id });
}
FORM.buildBatch = d => {
  const ids = Object.keys(d).filter(k => k.startsWith('o_')).map(k => k.slice(2)).filter(id => !payoutBlocks(id).length);
  if (!ids.length) { toast('Select at least one eligible organisation', true); return; }
  const p = { id: uid('po'), ref: 'PO-0' + (++S.seq.pay), status: 'awaiting_approval', createdBy: user().id, createdAt: now(), approvals: [], periodEnd: now(), items: [] };
  for (const id of ids) { const b = balances(id); const o = org(id); const adj = o.recovery || 0; p.items.push({ orgId: id, donationIds: b.freeIds, cents: b.availableGross - adj, adjustment: adj }); b.freeIds.forEach(x => don(x).payoutId = p.id); o.recovery = 0; }
  S.payouts.push(p); audit('Payout batch', p.ref, 'Batch created', '', 'awaiting_approval', ids.length + ' organisations'); toast('Batch ' + p.ref + ' created. Funds are reserved.'); nav('#/admin/payout/' + p.id);
};
function aPayoutDetail(R) {
  const p = S.payouts.find(x => x.id === R.parts[2]); if (!p) return empty('Batch not found', '');
  const u = user(); const creator = userById(p.createdBy);
  const canApprove = canACF('approve_payout') && p.status === 'awaiting_approval'; const selfBlock = S.settings.twoPerson && p.createdBy === u.id;
  const steps = ['awaiting_approval', 'approved', 'processing', 'settled']; const idx = steps.indexOf(p.status);
  return ptitle('Payout ' + p.ref, `Created ${fmtDT(p.createdAt)} by ${esc(creator?.name || '')}`, `<a class="btn btn-ghost" href="#/admin/payouts">All batches</a><button class="btn btn-ghost" data-act="exportBatch" data-id="${p.id}">Export CSV</button>`) +
    `<div class="stepper">${steps.map((s, i) => `<span class="${p.status === 'failed' && i === 2 ? '' : i < idx ? 'done' : i === idx ? 'on' : ''}">${['Awaiting approval', 'Approved', 'Released, processing', 'Settled'][i]}</span>`).join('')}${p.status === 'failed' ? '<span class="on" style="background:var(--danger)">Failed</span>' : ''}</div>
    <div class="panel"><div class="row">${p.status === 'awaiting_approval' ? (canApprove && !selfBlock ? `<button class="btn btn-primary" data-act="batchApprove" data-id="${p.id}">Approve batch</button>` : `<span class="small muted">${selfBlock ? 'You created this batch. A second authorised person must approve it.' : 'Waiting for approval by an authorised approver.'}</span>`) : ''}
    ${p.status === 'approved' ? (canACF('release') ? `<button class="btn btn-primary" data-act="batchRelease" data-id="${p.id}">Release payout</button>` : finOnly('Release')) : ''}
    ${p.status === 'processing' ? (canACF('release') ? `<button class="btn btn-primary" data-act="batchSettle" data-id="${p.id}">Mark settled</button><button class="btn btn-ghost" data-act="batchFail" data-id="${p.id}">Mark failed</button>` : finOnly('Settle')) : ''}
    ${p.status === 'settled' ? `<span class="small">Settled ${fmtDT(p.settledAt)}. Bank reference ${p.settlementRef}. Remittance statements sent.</span>` : ''}${p.status === 'failed' ? `<span class="small">Failed ${fmtDT(p.failedAt)}. Funds returned to available after confirming no transfer occurred.</span>` : ''}</div>
    <ul class="timeline" style="margin-top:1rem">${[[p.createdAt, 'Created by ' + (creator?.name || '')], ...p.approvals.map(a => [a.ts, 'Approved by ' + userById(a.by)?.name]), ...(p.releasedAt ? [[p.releasedAt, 'Released by ' + userById(p.releasedBy)?.name]] : []), ...(p.settledAt ? [[p.settledAt, 'Settled']] : []), ...(p.failedAt ? [[p.failedAt, 'Failed']] : [])].map(([t, s]) => `<li>${fmtDT(t)}: ${esc(s)}</li>`).join('')}</ul></div>` +
    table([{ h: 'Organisation', f: i => esc(org(i.orgId).name) }, { h: 'Gifts', num: 1, f: i => i.donationIds.length }, { h: 'Recovery', num: 1, f: i => i.adjustment ? money(-i.adjustment) : '' }, { h: 'Amount', num: 1, f: i => money(i.cents) }, { h: 'Bank', f: i => esc(org(i.orgId).bank.bsb + ' ' + org(i.orgId).bank.acct) }, { h: '', f: i => `<a class="btn btn-ghost btn-sm" href="#/admin/statement/${p.id}?o=${i.orgId}">Statement</a>` }], p.items);
}
function aStatement(R) { const p = S.payouts.find(x => x.id === R.parts[2]); const oid = R.q.get('o'); if (!p || !p.items.some(i => i.orgId === oid)) return empty('Statement not found', ''); return statementView(p, oid, '#/admin/payout/' + p.id); }

  <h4 style="margin-top:1rem">Event log</h4>${table([{ h: 'When', f: l => fmtDT(l.ts) }, { h: 'Event', f: l => esc(l.event) }, { h: 'Result', f: l => esc(l.result) }, { h: '', f: l => l.retry ? `<button class="btn btn-ghost btn-sm" data-act="intRetry" data-evt="${l.retry.evt}" data-o="${l.retry.o}" data-amt="${l.retry.amt}">Retry</button>` : '' }], (S.inbound || []), { emptyTitle: 'No events yet', emptyBody: '' })}</div>`;
}
ACT.intToggle = el => { const i = S.integrations.find(x => x.id === el.dataset.id); const p = i.status; i.status = i.status === 'connected' ? 'disconnected' : 'connected'; i.logs.unshift({ ts: now(), event: 'connection', result: i.status === 'connected' ? 'Connected (simulated)' : 'Disconnected' }); audit('Integration', i.name, i.status === 'connected' ? 'Connected' : 'Disconnected', p, i.status); render(); };
function ingest(evt, oid, amt, fail) {
  const log = (S.inbound = S.inbound || []);
  if (fail) { log.unshift({ ts: now(), event: 'donation.created ' + evt, result: 'Failed: provider timeout (simulated). Nothing recorded.', retry: { evt, o: oid, amt } }); return 'Event failed. Nothing recorded. You can retry.'; }
  const ex = S.donations.find(d => d.providerEventId === evt); if (ex) { log.unshift({ ts: now(), event: 'donation.created ' + evt, result: 'Duplicate. Matched existing ' + ex.ref + '. No new donation.' }); return 'Duplicate event ignored'; }
  const d = mkDon(S, { orgId: oid, first: 'External', last: 'Supporter', email: 'external@example.com', base: Math.round(amt * 100), method: 'integration', source: 'integration', status: 'processing', providerEventId: evt }); d.ref = 'ACF-' + (++S.seq.don); S.donations.push(d); succeed(d);
  log.unshift({ ts: now(), event: 'donation.created ' + evt, result: `Recorded ${d.ref} for ${org(oid).name}` }); log.forEach(l => { if (l.retry?.evt === evt) l.retry = null; }); return 'Recorded ' + d.ref;
}
FORM.intEvent = (d, f, e) => { if (!(+d.amt > 0) || !d.evt) { toast('Enter an amount and event id', true); return; } toast(ingest(d.evt.trim(), d.o, +d.amt, e.submitter?.value === 'fail')); render(); };
ACT.intRetry = el => { toast(ingest(el.dataset.evt, el.dataset.o, +el.dataset.amt, false)); render(); };
